<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PDF Tools</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 1.5em; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-top: 16px; }
  label { display: block; margin: 10px 0 4px; font-size: 0.9em; }
  input[type="number"] { width: 100px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
  input[type="file"] { margin-top: 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { margin-top: 16px; padding: 10px 18px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 1em; cursor: pointer; }
  button:disabled { background: #999; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 0.9em; color: #555; }
  .unit { display: inline-block; margin-left: 6px; font-size: 0.85em; color: #666; }
  select { padding: 6px; border-radius: 4px; border: 1px solid #ccc; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .checkbox-row label { margin: 0; }
  .checkbox-row input { margin: 0; }

  .tabs { display: flex; gap: 4px; border-bottom: 2px solid #ddd; margin-top: 20px; }
  .tab { padding: 10px 16px; cursor: pointer; border: none; background: none; color: #666; font-size: 0.95em; margin: 0; border-bottom: 2px solid transparent; margin-bottom: -2px; border-radius: 0; }
  .tab:hover { color: #222; }
  .tab.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 600; }
  .filelist { margin: 12px 0 0; padding-left: 22px; font-size: 0.85em; color: #555; max-height: 180px; overflow-y: auto; }
  .filelist li { margin: 2px 0; }
  .panel { display: none; }
  .panel.active { display: block; }
</style>
</head>
<body>
  <h1>PDF Tools</h1>

  <div class="tabs">
    <button class="tab active" data-tab="pad">여백 추가</button>
    <button class="tab" data-tab="merge2">2페이지 가로로 붙이기</button>
    <button class="tab" data-tab="img2pdf">이미지 → PDF</button>
  </div>

  <!-- ===== 여백 추가 ===== -->
  <div class="panel active" id="panel-pad">
    <p>PDF의 각 페이지 외곽에 여백을 추가합니다. (페이지 크기가 커지고, 기존 콘텐츠는 중앙에 배치됩니다.)</p>
    <div class="card">
      <label>PDF 파일</label>
      <input type="file" id="pad-file" accept="application/pdf">

      <label>단위
        <select id="pad-unit">
          <option value="pt">pt (포인트)</option>
          <option value="mm" selected>mm</option>
          <option value="in">inch</option>
        </select>
      </label>

      <div class="grid">
        <div>
          <label>위 (top)</label>
          <input type="number" id="pad-top" value="20" step="1">
        </div>
        <div>
          <label>아래 (bottom)</label>
          <input type="number" id="pad-bottom" value="20" step="1">
        </div>
        <div>
          <label>왼쪽 (left)</label>
          <input type="number" id="pad-left" value="20" step="1">
        </div>
        <div>
          <label>오른쪽 (right)</label>
          <input type="number" id="pad-right" value="20" step="1">
        </div>
      </div>

      <button id="pad-go" disabled>여백 추가하여 다운로드</button>
      <div class="status" id="pad-status"></div>
    </div>
  </div>

  <!-- ===== 2페이지 가로로 붙이기 ===== -->
  <div class="panel" id="panel-merge2">
    <p>2개의 페이지를 가로로 나란히 붙여 한 페이지로 만듭니다. (새 페이지 너비는 두 페이지의 합, 높이는 둘 중 큰 값입니다.)</p>
    <div class="card">
      <label>PDF 파일</label>
      <input type="file" id="merge2-file" accept="application/pdf">

      <div class="checkbox-row">
        <input type="checkbox" id="merge2-firstalone">
        <label for="merge2-firstalone">첫번째 페이지만 혼자 두기</label>
      </div>

      <button id="merge2-go" disabled>가로로 붙여서 다운로드</button>
      <div class="status" id="merge2-status"></div>
    </div>
  </div>

  <!-- ===== 이미지 → PDF ===== -->
  <div class="panel" id="panel-img2pdf">
    <p>여러 이미지를 하나의 PDF로 만듭니다. (각 페이지는 해당 이미지 크기에 맞춰 생성됩니다.)</p>
    <div class="card">
      <label>이미지 파일 (여러 개 선택 가능)</label>
      <input type="file" id="img-file" accept="image/*" multiple>

      <label>해상도 (DPI) — 이미지 픽셀을 페이지 크기로 환산할 때 사용
        <input type="number" id="img-dpi" value="72" min="1" step="1">
      </label>

      <div class="checkbox-row">
        <input type="checkbox" id="img-sortname" checked>
        <label for="img-sortname">파일 이름 순으로 정렬</label>
      </div>

      <ol class="filelist" id="img-list"></ol>

      <button id="img-go" disabled>PDF로 만들어 다운로드</button>
      <div class="status" id="img-status"></div>
    </div>
  </div>

<script>
const { PDFDocument } = PDFLib;

// ----- 탭 전환 -----
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

function toPt(value, unit) {
  if (unit === 'mm') return value * 2.834645669;
  if (unit === 'in') return value * 72;
  return value;
}

function download(bytes, name) {
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

// 파일 선택 헬퍼: 선택 시 바이트/이름 저장 후 버튼 활성화
function bindFile(fileId, btnId, statusId, suffix, state) {
  const fileInput = document.getElementById(fileId);
  const btn = document.getElementById(btnId);
  const statusEl = document.getElementById(statusId);
  fileInput.addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    state.bytes = await f.arrayBuffer();
    state.name = f.name.replace(/\.pdf$/i, '') + suffix + '.pdf';
    btn.disabled = false;
    statusEl.textContent = `로드됨: ${f.name}`;
  });
}

// ===== 여백 추가 =====
const padState = {};
bindFile('pad-file', 'pad-go', 'pad-status', '-padded', padState);

document.getElementById('pad-go').addEventListener('click', async () => {
  if (!padState.bytes) return;
  const btn = document.getElementById('pad-go');
  const statusEl = document.getElementById('pad-status');
  btn.disabled = true;
  statusEl.textContent = '처리 중...';
  try {
    const unit = document.getElementById('pad-unit').value;
    const top = toPt(parseFloat(document.getElementById('pad-top').value) || 0, unit);
    const bottom = toPt(parseFloat(document.getElementById('pad-bottom').value) || 0, unit);
    const left = toPt(parseFloat(document.getElementById('pad-left').value) || 0, unit);
    const right = toPt(parseFloat(document.getElementById('pad-right').value) || 0, unit);

    const src = await PDFDocument.load(padState.bytes);
    const out = await PDFDocument.create();
    const pageCount = src.getPageCount();
    // 모든 페이지를 한 번에 embed (반복 호출 시 매번 전체 PDF를 재파싱하는 것을 방지)
    const embeds = await out.embedPdf(padState.bytes, [...Array(pageCount).keys()]);

    for (let i = 0; i < pageCount; i++) {
      const { width: w, height: h } = src.getPage(i).getSize();
      const newPage = out.addPage([w + left + right, h + top + bottom]);
      newPage.drawPage(embeds[i], { x: left, y: bottom, width: w, height: h });
      statusEl.textContent = `처리 중... ${i + 1} / ${pageCount}`;
    }

    download(await out.save(), padState.name);
    statusEl.textContent = '완료!';
  } catch (err) {
    console.error(err);
    statusEl.textContent = '오류: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});

// ===== 2페이지 가로로 붙이기 =====
const merge2State = {};
bindFile('merge2-file', 'merge2-go', 'merge2-status', '-2up', merge2State);

document.getElementById('merge2-go').addEventListener('click', async () => {
  if (!merge2State.bytes) return;
  const btn = document.getElementById('merge2-go');
  const statusEl = document.getElementById('merge2-status');
  btn.disabled = true;
  statusEl.textContent = '처리 중...';
  try {
    const firstAlone = document.getElementById('merge2-firstalone').checked;
    const src = await PDFDocument.load(merge2State.bytes);
    const out = await PDFDocument.create();
    const pageCount = src.getPageCount();
    // 모든 페이지를 한 번에 embed (반복 호출 시 매번 전체 PDF를 재파싱하는 것을 방지)
    const embeds = await out.embedPdf(merge2State.bytes, [...Array(pageCount).keys()]);

    // 붙일 페이지 인덱스를 쌍으로 그룹화
    const groups = [];
    let start = 0;
    if (firstAlone && pageCount > 0) {
      groups.push([0]);
      start = 1;
    }
    for (let i = start; i < pageCount; i += 2) {
      groups.push(i + 1 < pageCount ? [i, i + 1] : [i]);
    }

    for (let g = 0; g < groups.length; g++) {
      const idxs = groups[g];
      const pageEmbeds = idxs.map(i => embeds[i]);
      const sizes = idxs.map(i => src.getPage(i).getSize());

      if (idxs.length === 1) {
        // 단독 페이지: 원본 크기 그대로
        const { width: w, height: h } = sizes[0];
        const page = out.addPage([w, h]);
        page.drawPage(pageEmbeds[0], { x: 0, y: 0, width: w, height: h });
      } else {
        const totalW = sizes[0].width + sizes[1].width;
        const maxH = Math.max(sizes[0].height, sizes[1].height);
        const page = out.addPage([totalW, maxH]);
        // 왼쪽 페이지 (세로 중앙 정렬)
        page.drawPage(pageEmbeds[0], {
          x: 0,
          y: (maxH - sizes[0].height) / 2,
          width: sizes[0].width,
          height: sizes[0].height,
        });
        // 오른쪽 페이지
        page.drawPage(pageEmbeds[1], {
          x: sizes[0].width,
          y: (maxH - sizes[1].height) / 2,
          width: sizes[1].width,
          height: sizes[1].height,
        });
      }
      statusEl.textContent = `처리 중... ${g + 1} / ${groups.length}`;
    }

    download(await out.save(), merge2State.name);
    statusEl.textContent = '완료!';
  } catch (err) {
    console.error(err);
    statusEl.textContent = '오류: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});

// ===== 이미지 → PDF =====
const imgState = { files: [], picked: [] };

function naturalCompare(a, b) {
  return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
}

function renderImgList() {
  const listEl = document.getElementById('img-list');
  listEl.innerHTML = '';
  for (const f of imgState.files) {
    const li = document.createElement('li');
    li.textContent = f.name;
    listEl.appendChild(li);
  }
}

function sortImgFiles() {
  if (document.getElementById('img-sortname').checked) {
    imgState.files.sort((a, b) => naturalCompare(a.name, b.name));
  } else {
    imgState.files = imgState.picked.slice();
  }
}

document.getElementById('img-file').addEventListener('change', (e) => {
  imgState.picked = Array.from(e.target.files);
  imgState.files = imgState.picked.slice();
  sortImgFiles();
  renderImgList();
  document.getElementById('img-go').disabled = imgState.files.length === 0;
  document.getElementById('img-status').textContent =
    imgState.files.length ? `${imgState.files.length}개의 이미지가 선택되었습니다.` : '';
});

document.getElementById('img-sortname').addEventListener('change', () => {
  sortImgFiles();
  renderImgList();
});

// 매직 넘버로 PNG / JPEG 판별 (확장자나 MIME 타입이 틀린 경우에도 동작)
function sniffType(bytes) {
  const b = new Uint8Array(bytes);
  if (b.length >= 8 && b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return 'png';
  if (b.length >= 3 && b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) return 'jpg';
  return null;
}

// pdf-lib이 직접 지원하지 않는 형식(webp, gif, bmp, svg 등)은 캔버스로 PNG 변환
function toPngViaCanvas(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        if (!canvas.width || !canvas.height) throw new Error('이미지 크기를 알 수 없습니다');
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(async (blob) => {
          URL.revokeObjectURL(url);
          if (!blob) return reject(new Error('PNG 변환에 실패했습니다'));
          resolve(await blob.arrayBuffer());
        }, 'image/png');
      } catch (err) {
        URL.revokeObjectURL(url);
        reject(err);
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('이미지를 읽을 수 없습니다'));
    };
    img.src = url;
  });
}

document.getElementById('img-go').addEventListener('click', async () => {
  if (!imgState.files.length) return;
  const btn = document.getElementById('img-go');
  const statusEl = document.getElementById('img-status');
  btn.disabled = true;
  statusEl.textContent = '처리 중...';
  try {
    const dpi = parseFloat(document.getElementById('img-dpi').value) || 72;
    const scale = 72 / dpi; // 픽셀 -> 포인트
    const out = await PDFDocument.create();
    const failed = [];

    for (let i = 0; i < imgState.files.length; i++) {
      const file = imgState.files[i];
      statusEl.textContent = `처리 중... ${i + 1} / ${imgState.files.length} (${file.name})`;
      try {
        let bytes = await file.arrayBuffer();
        let type = sniffType(bytes);
        if (!type) {
          bytes = await toPngViaCanvas(file);
          type = 'png';
        }
        const image = type === 'png' ? await out.embedPng(bytes) : await out.embedJpg(bytes);
        const w = image.width * scale;
        const h = image.height * scale;
        // 각 이미지 크기에 딱 맞는 페이지를 만들어 이미지를 가득 채운다
        const page = out.addPage([w, h]);
        page.drawImage(image, { x: 0, y: 0, width: w, height: h });
      } catch (err) {
        console.error(file.name, err);
        failed.push(file.name);
      }
    }

    if (out.getPageCount() === 0) throw new Error('변환할 수 있는 이미지가 없습니다');

    const base = imgState.files[0].name.replace(/\.[^.]+$/, '');
    download(await out.save(), base + '-images.pdf');
    statusEl.textContent = failed.length
      ? `완료! (건너뛴 파일 ${failed.length}개: ${failed.join(', ')})`
      : '완료!';
  } catch (err) {
    console.error(err);
    statusEl.textContent = '오류: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
